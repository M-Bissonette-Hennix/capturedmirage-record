name: RECORD Recognition Commissioning QA

on:
  push:
    branches:
      - record-recognition-commissioning
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-recognition-commissioning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commissioning branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Deterministic source QA
        run: npm run check

      - name: Build default fail-closed distribution
        run: npm run build

      - name: Verify distribution
        run: npm run check:dist

      - name: Generate ephemeral dedicated-origin runtime
        run: node scripts/ci-production-runtime.mjs

      - name: Build dedicated-origin production path
        run: npm run build
        env:
          RECORD_RUNTIME_CONFIG: .release/runtime-ci-production.json

      - name: Verify dedicated-origin production distribution
        run: npm run check:dist

      - name: Exercise exact operator preflight
        shell: bash
        run: |
          cp .release/runtime-ci-production.json config/runtime.production.json
          npm run recognition:preflight

      - name: Remove ephemeral operator production runtime
        if: always()
        shell: bash
        run: rm -f config/runtime.production.json

      - name: Prove operator preflight restored tracked fail-closed dist
        run: git diff --exit-code -- dist

      - name: Validate Wrangler configuration and generated types
        run: npx --yes wrangler@4.138.0 types --config gateway/wrangler.jsonc --env-interface RecordGatewayEnv

      - name: Bundle Cloudflare gateway without deployment
        shell: bash
        run: |
          mkdir -p .release/wrangler-dry-run
          cat > .release/ci-worker-secrets.json <<'JSON'
          {
            "RECORD_GATEWAY_PRIVATE_JWK": "ci-private-jwk-placeholder",
            "RECORD_GATEWAY_PUBLIC_JWK": "ci-public-jwk-placeholder",
            "RECORD_GATEWAY_KEY_ID": "ci-key-id-placeholder",
            "RECORD_BOOTSTRAP_TOKEN_ID": "ci-bootstrap-token-placeholder",
            "RECORD_BOOTSTRAP_SECRET": "ci-bootstrap-secret-placeholder",
            "RECORD_OPENAI_API_KEY": "ci-openai-key-placeholder"
          }
          JSON
          npx --yes wrangler@4.138.0 deploy             --dry-run             --outdir .release/wrangler-dry-run             --config gateway/wrangler.jsonc             --secrets-file .release/ci-worker-secrets.json
          rm -f .release/ci-worker-secrets.json
